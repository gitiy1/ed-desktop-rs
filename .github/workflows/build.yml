name: desktop-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: endao-desktop-linux
            binary: endao-desktop
          # macos-15 is the standard Apple Silicon runner image.
          - os: macos-15
            artifact: endao-desktop-macos-arm64
            binary: endao-desktop
          - os: windows-2022
            artifact: endao-desktop-windows
            binary: endao-desktop.exe
    runs-on: ${{ matrix.os }}
    env:
      # Matches LSMinimumSystemVersion in the macOS application bundle.
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxcb-randr0-dev libxcb-xinerama0-dev libxcb-cursor-dev libwayland-dev libfontconfig1-dev libxkbcommon-x11-dev libgl1-mesa-dev
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Verify macOS ARM64 artifact
        if: runner.os == 'macOS'
        run: lipo target/release/endao-desktop -verify_arch arm64
      - name: Package macOS app and disk image
        if: runner.os == 'macOS'
        run: sh scripts/package_macos.sh target/release
      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            target/release/endao-desktop-macos-arm64.app.zip
            target/release/endao-desktop-macos-arm64.dmg
            target/release/endao-desktop
      - name: Upload Linux or Windows binary
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: target/release/${{ matrix.binary }}
