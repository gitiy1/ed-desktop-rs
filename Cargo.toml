[package]
name = "endao-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.100"
aes = "0.8.4"
async-channel = "2.5.0"
base64 = "0.22.1"
cbc = "0.1.2"
cipher = "0.4.4"
directories = "6.0.0"
dotenvy = "0.15.7"
flate2 = "1.1.5"
gpui = "0.2.2"
percent-encoding = "2.3.2"
regex = "1.11.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
rfd = "0.15.4"
roxmltree = "0.20.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sys-locale = "0.3.2"
sysproxy = "0.3.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
xmltree = "0.11.0"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23.0"
gpui = { version = "0.2.2", features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.10.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
xattr = { path = "vendor/xattr" }
